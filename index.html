<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хоррор-квест · Мессенджер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0b0c0e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .messenger {
      width: 100%;
      max-width: 460px;
      height: 780px;
      background: #14171c;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a2f36 inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 18px 20px 10px 20px;
      background: #1a1e24;
      border-bottom: 1px solid #2c323a;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .avatar {
      width: 42px;
      height: 42px;
      background: #2d333c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #b9c2d0;
      border: 1px solid #3f4854;
    }
    .chat-info {
      flex: 1;
    }
    .chat-name {
      color: #e8edf5;
      font-weight: 600;
      font-size: 17px;
    }
    .chat-status {
      color: #7e8a9c;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #3f8c5c;
      border-radius: 50%;
      margin-right: 4px;
    }
    .status-dot.offline {
      background: #5f6b7a;
    }
    .messages {
      flex: 1;
      padding: 16px 16px 8px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #101316;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar {
      width: 4px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: #2f3844;
      border-radius: 20px;
    }
    .bubble {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      animation: fadeSlide 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .bubble.in {
      align-self: flex-start;
      background: #1e2530;
      color: #e3e9f2;
      border-bottom-left-radius: 6px;
      border: 1px solid #2b333e;
    }
    .bubble.out {
      align-self: flex-end;
      background: #2b6b9e;
      color: white;
      border-bottom-right-radius: 6px;
    }
    .bubble .time {
      font-size: 11px;
      color: #7a889b;
      margin-top: 6px;
      text-align: right;
      opacity: 0.7;
    }
    .bubble.out .time {
      color: #c2d6ed;
    }
    .bubble .timer-badge {
      background: #d14a4a;
      color: white;
      font-size: 12px;
      font-weight: 600;
      border-radius: 30px;
      padding: 2px 12px;
      display: inline-block;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .bubble .options {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bubble .options button {
      background: #252e3b;
      border: 1px solid #3a4555;
      color: #dde5f0;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
      text-align: left;
    }
    .bubble .options button:hover {
      background: #2f3b4b;
      border-color: #4f5f75;
    }
    .bubble .options button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .system-message {
      align-self: center;
      background: #1f1f2a;
      color: #b0bbc9;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid #2d3340;
      max-width: 92%;
      text-align: center;
      font-family: 'Courier New', monospace;
      animation: fadeSlide 0.3s ease;
    }
    .input-area {
      padding: 10px 16px 18px 16px;
      background: #14171c;
      border-top: 1px solid #252b33;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      background: #1f2630;
      border: 1px solid #2b333e;
      border-radius: 30px;
      padding: 12px 18px;
      color: #e8edf5;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .input-area input:focus {
      border-color: #3a6d9e;
      background: #1c232e;
    }
    .input-area input::placeholder {
      color: #5a677a;
    }
    .input-area input:disabled {
      opacity: 0.4;
    }
    .input-area button {
      background: #2b6b9e;
      border: none;
      border-radius: 30px;
      padding: 10px 18px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
    }
    .input-area button:hover {
      background: #347bb3;
      transform: scale(0.97);
    }
    .input-area button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .messenger { height: 95vh; border-radius: 24px; }
    }
  </style>
</head>
<body>
<div class="messenger" id="app">
  <div class="header">
    <div class="avatar">👤</div>
    <div class="chat-info">
      <div class="chat-name">📱 Брат · пропал</div>
      <div class="chat-status">
        <span class="status-dot offline"></span>
        <span id="statusText">был(а) вчера</span>
      </div>
    </div>
    <div class="header-icons">
      <span>📁</span>
      <span>🔍</span>
    </div>
  </div>

  <div class="messages" id="messageContainer"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Введите ответ..." autofocus />
    <button id="sendBtn">➤ Отправить</button>
  </div>
</div>

<script>
// ============================================================
//  БОЛЬШАЯ БАЗА ВОПРОСОВ
// ============================================================

    { q: 'Какая планета ближайшая к солнцу?', options: ['Марс', 'Венера', 'Меркурий'], correct: 2 },
    { q: 'У какого животного есть хобот?', options: ['Слон', 'Лев', 'Тигр'], correct: 0 },
    { q: 'В каком виде спорта используется мяч и сетка?', options: ['Бейсбол', 'Волейбол', 'Гольф'], correct: 1 },
    { q: 'Какая из этих одежд подходит для зимы?', options: ['Купальник', 'Тёплый свитер', 'Спортивные шорты'], correct: 1 },
    { q: 'Кто написал «Войну и мир»?', options: ['Толстой', 'Достоевский', 'Чехов'], correct: 0 },
    { q: 'Что обычно делаете с заклёпками?', options: ['Закрепляете что-то', 'Чистите зубы', 'Подаёте в суд'], correct: 0 },
    { q: 'В каком месяце бывает Хэллоуин?', options: ['Март', 'Октябрь', 'Июль'], correct: 1 },
    { q: 'Что из этого можно есть?', options: ['Мыло', 'Яблоко', 'Грунт'], correct: 1 },
    { q: 'Какая из этих животных зеленого цвета?', options: ['Лампа', 'Яблоко', 'Змея'], correct: 2 },
    { q: 'Что происходит при закипании воды?', options: ['Она замерзает', 'Вода превращается в пар', 'Вода становится темнее'], correct: 1 },
    { q: 'Какая из этих книг принадлежит Ньютону?', options: ['Закон тяготения', 'Убийство в Восточном экспрессе', 'Гарри Поттер'], correct: 0 },

    { q: 'Что используют для рисования?', options: ['Карандаш', 'Молоток', 'Лупа'], correct: 0 },
    { q: 'Какая еда из этих — овощ?', options: ['Картофель', 'Буряк', 'Всё выше'], correct: 2 },

    { q: 'Назовите слово, которое состоит из 4 букв, и в нем есть буква «а».', options: ['Молоко', 'Лампа', 'Змея'], correct: 1 },
    { q: 'Какие из этих городов расположены на берегу моря?', options: ['Москва', 'Санкт-Петербург', 'Новосибирск'], correct: 1 },
    { q: 'Почему компьютер работает быстрее, если он обновлён?', options: ['Свежий воздух', 'Новая прошивка', 'Он устал'], correct: 1 },
    { q: 'В чем разница между "кислотой" и "щелочью"?', options: ['В запахе', 'В свойствах рН', 'В цвете'], correct: 1 },
    { q: 'Какая из этих книг написана Чарльзом Диккенсом?', options: ['Оливер Твист', 'Гарри Поттер', 'Война и мир'], correct: 0 },
    { q: 'Что высотой выше — гора или здание?', options: ['Гора', 'Здание', 'Одинаково'], correct: 0 },
    { q: 'Какие из этих вещей не растут на дереве?', options: ['Вишня', 'Молоко', 'Орехи'], correct: 1 },
    { q: 'Чем отличается человек от робота?', options: ['У человека есть сердце', 'У робота есть мозг', 'У человека есть волосы'], correct: 0 },
    { q: 'Почему снег белый?', options: ['Из-за отражения света', 'Он был крещён снегом', 'Потому что он — молоко'], correct: 0 },
    { q: 'Какие из этих предметов связаны с погодой?', options: ['Зонт', 'Очки', 'Телефон'], correct: 0 },
    { q: 'Кто из этих героев — русский?', options: ['Робин Гуд', 'Иван Царевич', 'Купидон'], correct: 1 },
    { q: 'Какое насекомое умеет делать мед?', options: ['Пчела', 'Муравей', 'Комар'], correct: 0 },
    { q: 'Что нельзя увидеть своими глазами?', options: ['Время', 'Облака', 'Птицу'], correct: 0 },
  ],
};

// ============================================================
//  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================================
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ============================================================
//  ИГРОВОЙ ДВИЖОК
// ============================================================
const container = document.getElementById('messageContainer');
const input = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const statusText = document.getElementById('statusText');

let currentLevel = 'intro';
let timerInterval = null;
let timerSeconds = 30;
let gameOver = false;
let waitingForAnswer = false;
let isProcessing = false;
let timerId = 0;
let audioCtx = null;

// ---- Инициализация аудио ----
function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (_) {
      // Если аудио не поддерживается, просто игнорируем
      audioCtx = null;
    }
  }
  // Пытаемся возобновить контекст
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
}

// ---- Звуки (безопасная версия) ----
function playBeep(freq = 800, duration = 120, type = 'sine') {
  try {
    initAudio();
    if (!audioCtx) return;
    
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = type;
    oscillator.frequency.value = freq;
    
    gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
    
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration / 1000);
  } catch (_) {
    // Игнорируем ошибки звука
  }
}

function playGlitch() { 
  playBeep(1800, 80, 'square'); 
  setTimeout(() => playBeep(900, 100, 'sawtooth'), 100); 
}

// ---- Добавление сообщений ----
function addMessage(text, type = 'in', timer = null, extra = null) {
  const div = document.createElement('div');
  div.className = `bubble ${type}`;
  let html = '';
  
  if (timer !== null && timer > 0) {
    timerId++;
    const uniqueTimerId = `timer_${timerId}`;
    html += `<div class="timer-badge" id="${uniqueTimerId}">⏳ ${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}</div>`;
    div.dataset.timerId = uniqueTimerId;
    div.dataset.timerSeconds = timer;
  }
  
  html += text;
  if (extra) html += extra;
  const timeNow = new Date();
  const timeStr = String(timeNow.getHours()).padStart(2,'0') + ':' + String(timeNow.getMinutes()).padStart(2,'0');
  html += `<div class="time">${timeStr}</div>`;
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  if (type !== 'out') {
    playBeep(600, 60);
  }
  return div;
}

function addSystemMessage(text) {
  const div = document.createElement('div');
  div.className = 'system-message';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  playGlitch();
}

// ---- Таймер ----
function startTimer(seconds) {
  stopTimer();
  timerSeconds = seconds;
  waitingForAnswer = true;
  
  const lastMessage = container.querySelector('.bubble.in:last-child');
  const timerEl = lastMessage ? document.getElementById(lastMessage.dataset.timerId) : null;
  
  if (timerEl) {
    timerEl.textContent = `⏳ ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  }
  
  timerInterval = setInterval(() => {
    timerSeconds--;
    
    const lastMsg = container.querySelector('.bubble.in:last-child');
    const timerElem = lastMsg ? document.getElementById(lastMsg.dataset.timerId) : null;
    if (timerElem) {
      timerElem.textContent = `⏳ ${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;
    }
    
    if (timerSeconds <= 0) {
      stopTimer();
      waitingForAnswer = false;
      handleTimeout();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  waitingForAnswer = false;
}

function handleTimeout() {
  if (gameOver) return;
  gameOver = true;
  addSystemMessage('⏰ ВРЕМЯ ВЫШЛО. Связь прервана...');
  addMessage('Ты не успел. Брат... пропал навсегда.', 'in');
  statusText.textContent = '📡 сигнал потерян';
  input.disabled = true;
  sendBtn.disabled = true;
  playBeep(300, 400, 'sawtooth');
}

// ---- Показ вопроса с кнопками ----
function showQuestion(q, level) {
  if (gameOver || isProcessing) return;
  
  isProcessing = true;
  const shuffled = shuffleArray([...q.options]);
  const correctAnswer = q.options[q.correct];
  const correctIndex = shuffled.indexOf(correctAnswer);

  let html = q.q;
  html += `<div class="options">`;
  shuffled.forEach((opt, idx) => {
    html += `<button data-answer="${opt}" data-correct="${idx === correctIndex ? 'true' : 'false'}" class="option-btn">${opt}</button>`;
  });
  html += `</div>`;

  addMessage(html, 'in', 30);
  startTimer(30);

  setTimeout(() => {
    const btns = container.querySelectorAll('.option-btn');
    btns.forEach(btn => {
      btn.addEventListener('click', function(e) {
        if (gameOver || !waitingForAnswer || isProcessing) return;
        const isCorrect = this.dataset.correct === 'true';
        const answerText = this.dataset.answer;
        
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        stopTimer();
        waitingForAnswer = false;
        isProcessing = true;

        if (isCorrect) {
          addMessage(`✅ Верно! ${answerText}`, 'out');
          playBeep(1200, 150);
          
          setTimeout(() => {
            isProcessing = false;
            goToNextLevel(level);
          }, 1000);
        } else {
          addMessage(`❌ Неверно. Попробуй ещё раз.`, 'out');
          playBeep(200, 300, 'square');
          
          setTimeout(() => {
            isProcessing = false;
            if (!gameOver) {
              const newQ = pickRandom(QUESTION_BANK[level]);
              showQuestion(newQ, level);
            }
          }, 1200);
        }
      });
    });
    isProcessing = false;
  }, 100);
}

// ---- Переход между уровнями ----
function goToNextLevel(currentLevel) {
  if (gameOver) return;
  
  const levelOrder = ['easy', 'medium', 'hard'];
  const currentIndex = levelOrder.indexOf(currentLevel);
  
  if (currentLevel === 'intro' || currentIndex === -1) {
    setTimeout(() => {
      const q = pickRandom(QUESTION_BANK.easy);
      showQuestion(q, 'easy');
    }, 800);
    return;
  }
  
  if (currentIndex < levelOrder.length - 1) {
    const nextLevel = levelOrder[currentIndex + 1];
    setTimeout(() => {
      const q = pickRandom(QUESTION_BANK[nextLevel]);
      showQuestion(q, nextLevel);
    }, 800);
  } else {
    setTimeout(() => {
      addSystemMessage('📁 Последний файл расшифрован...');
      addMessage('Ты узнал правду. Но брат... он исчез навсегда.', 'in');
      addMessage('Или нет? Возможно, это только начало.', 'in');
      statusText.textContent = '📴 история завершена';
      input.disabled = true;
      sendBtn.disabled = true;
      gameOver = true;
      playBeep(1000, 200);
    }, 1000);
  }
}

// ---- Обработка ввода ----
function handleTextAnswer(text) {
  addSystemMessage('⛔ Используй кнопки для ответа!');
}

// ---- Инициализация ----
function init() {
  // Инициализируем аудио при первом клике
  document.addEventListener('click', initAudio, { once: true });
  document.addEventListener('touchstart', initAudio, { once: true });
  
  sendBtn.addEventListener('click', () => {
    initAudio(); // Активируем аудио при отправке
    const text = input.value.trim();
    if (!text) return;
    if (gameOver) return;
    addMessage(text, 'out');
    input.value = '';
    handleTextAnswer(text);
  });
  
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendBtn.click();
  });

  addSystemMessage('🔓 доступ к аккаунту брата получен · файлы зашифрованы');
  setTimeout(() => {
    const q = pickRandom(QUESTION_BANK.easy);
    showQuestion(q, 'easy');
  }, 800);
}

// Запускаем инициализацию после загрузки страницы
if (document.readyState === 'loading') {
