<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хоррор-квест · Мессенджер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0b0c0e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .messenger {
      width: 100%;
      max-width: 460px;
      height: 780px;
      background: #14171c;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a2f36 inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 18px 20px 10px 20px;
      background: #1a1e24;
      border-bottom: 1px solid #2c323a;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .avatar {
      width: 42px;
      height: 42px;
      background: #2d333c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #b9c2d0;
      border: 1px solid #3f4854;
    }
    .chat-info {
      flex: 1;
    }
    .chat-name {
      color: #e8edf5;
      font-weight: 600;
      font-size: 17px;
    }
    .chat-status {
      color: #7e8a9c;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #3f8c5c;
      border-radius: 50%;
      margin-right: 4px;
    }
    .status-dot.offline {
      background: #5f6b7a;
    }
    .progress-bar {
      height: 3px;
      background: #1a1e24;
      flex-shrink: 0;
      position: relative;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #2b6b9e, #4a8fc7);
      transition: width 0.4s ease;
      width: 0%;
    }
    .messages {
      flex: 1;
      padding: 16px 16px 8px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #101316;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar {
      width: 4px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: #2f3844;
      border-radius: 20px;
    }
    .bubble {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      animation: fadeSlide 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .bubble.in {
      align-self: flex-start;
      background: #1e2530;
      color: #e3e9f2;
      border-bottom-left-radius: 6px;
      border: 1px solid #2b333e;
    }
    .bubble.out {
      align-self: flex-end;
      background: #2b6b9e;
      color: white;
      border-bottom-right-radius: 6px;
    }
    .bubble .time {
      font-size: 11px;
      color: #7a889b;
      margin-top: 6px;
      text-align: right;
      opacity: 0.7;
    }
    .bubble.out .time {
      color: #c2d6ed;
    }
    .bubble .timer-badge {
      background: #d14a4a;
      color: white;
      font-size: 12px;
      font-weight: 600;
      border-radius: 30px;
      padding: 2px 12px;
      display: inline-block;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .bubble .options {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bubble .options button {
      background: #252e3b;
      border: 1px solid #3a4555;
      color: #dde5f0;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
      text-align: left;
    }
    .bubble .options button:hover {
      background: #2f3b4b;
      border-color: #4f5f75;
    }
    .bubble .options button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .bubble .hack-tag {
      display: inline-block;
      background: #2a1f1f;
      border: 1px solid #633f3f;
      color: #d98c5f;
      font-size: 11px;
      padding: 2px 12px;
      border-radius: 30px;
      font-family: monospace;
      margin-bottom: 6px;
    }
    .system-message {
      align-self: center;
      background: #1f1f2a;
      color: #b0bbc9;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid #2d3340;
      max-width: 92%;
      text-align: center;
      font-family: 'Courier New', monospace;
      animation: fadeSlide 0.3s ease;
    }
    .input-area {
      padding: 10px 16px 18px 16px;
      background: #14171c;
      border-top: 1px solid #252b33;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      background: #1f2630;
      border: 1px solid #2b333e;
      border-radius: 30px;
      padding: 12px 18px;
      color: #e8edf5;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .input-area input:focus {
      border-color: #3a6d9e;
      background: #1c232e;
    }
    .input-area input::placeholder {
      color: #5a677a;
    }
    .input-area input:disabled {
      opacity: 0.4;
    }
    .input-area button {
      background: #2b6b9e;
      border: none;
      border-radius: 30px;
      padding: 10px 18px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
    }

      pointer-events: none;

    }

      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ---- Звуки ----
function playBeep(freq = 800, duration = 120, type = 'sine') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration / 1000);
  } catch (_) {}
}
function playGlitch() { playBeep(1800, 80, 'square'); setTimeout(() => playBeep(900, 100, 'sawtooth'), 100); }

// ---- Добавление сообщений ----
function addMessage(text, type = 'in', timer = null, extra = null) {
  const div = document.createElement('div');
  div.className = `bubble ${type}`;
  let html = '';
  if (timer !== null && timer > 0) {
    html += `<div class="timer-badge" id="activeTimer">⏳ ${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}</div>`;
  }
  html += text;
  if (extra) html += extra;
  const timeNow = new Date();
  const timeStr = String(timeNow.getHours()).padStart(2,'0') + ':' + String(timeNow.getMinutes()).padStart(2,'0');
  html += `<div class="time">${timeStr}</div>`;
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  playBeep(600, 60);
}

function addSystemMessage(text) {
  const div = document.createElement('div');
  div.className = 'system-message';
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  playGlitch();
}

// ---- Прогресс ----
function updateProgress() {
  const pct = (questionIndex / TOTAL_QUESTIONS) * 100;
  progressFill.style.width = Math.min(pct, 100) + '%';
  questionCounter.textContent = `${Math.min(questionIndex, TOTAL_QUESTIONS)} / ${TOTAL_QUESTIONS}`;
}

// ---- Таймер ----
function startTimer(seconds) {
  stopTimer();
  timerSeconds = seconds;
  waitingForAnswer = true;
  const timerEl = document.getElementById('activeTimer');
  if (timerEl) {
    timerEl.textContent = `⏳ ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
  }
  timerInterval = setInterval(() => {
    timerSeconds--;
    const el = document.getElementById('activeTimer');
    if (el) {
      el.textContent = `⏳ ${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;
    }
    if (timerSeconds <= 0) {
      stopTimer();
      waitingForAnswer = false;
      handleTimeout();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  waitingForAnswer = false;
}

function handleTimeout() {
  if (gameOver) return;
  gameOver = true;
  addSystemMessage('⏰ ВРЕМЯ ВЫШЛО. Связь прервана...');
  addMessage('Ты не успел. Брат... пропал навсегда.', 'in');
  statusText.textContent = '📡 сигнал потерян';
  input.disabled = true;
  sendBtn.disabled = true;
  playBeep(300, 400, 'sawtooth');
}

// ---- Генерация вопроса без повторений ----
function generateQuestion() {
  // Определяем уровень сложности (прогрессия)
  let pool;
  if (questionIndex < 8) {
    currentLevel = 'easy';
    pool = QUESTION_BANK.easy;
  } else if (questionIndex < 16) {
    currentLevel = 'medium';
    pool = QUESTION_BANK.medium;
  } else {
    currentLevel = 'hard';
    pool = QUESTION_BANK.hard;
  }

  // Редкий шанс на странный вопрос (10%)
  if (Math.random() < 0.10 && QUESTION_BANK.weird.length > 0) {
    const available = QUESTION_BANK.weird.filter(q => !usedQuestions.includes(q));
    if (available.length > 0) {
      const q = pickRandom(available);
      usedQuestions.push(q);
      return { ...q, level: 'weird' };
    }
  }

  // Очень редкий шанс на хулиганский вопрос (5%) — ВСЕ ОТВЕТЫ ПРАВИЛЬНЫЕ
  if (Math.random() < 0.05 && QUESTION_BANK.hooligan.length > 0) {
    const available = QUESTION_BANK.hooligan.filter(q => !usedQuestions.includes(q));
    if (available.length > 0) {
      const q = pickRandom(available);
      usedQuestions.push(q);
      // Делаем все ответы правильными (индекс 0, но для красоты помечаем все как правильные)
      return { ...q, level: 'hooligan', allCorrect: true };
    }
  }

  // Обычный вопрос из текущего пула
  const available = pool.filter(q => !usedQuestions.includes(q));
  if (available.length === 0) {
    // Если все вопросы использованы — берём любой
    const fallback = pickRandom(pool);
    usedQuestions.push(fallback);
    return { ...fallback, level: currentLevel };
  }
  const q = pickRandom(available);
  usedQuestions.push(q);
  return { ...q, level: currentLevel };
}

// ---- Показ вопроса ----
function showQuestion() {
  if (gameOver) return;

  // Проверяем, не закончились ли вопросы
  if (questionIndex >= TOTAL_QUESTIONS) {
    finishGame();
    return;
  }

  const q = generateQuestion();
  const isHooligan = q.level === 'hooligan';
  const isWeird = q.level === 'weird';

  // Перемешиваем варианты
  const shuffled = shuffleArray([...q.options]);
  // Для хулиганских — все правильные, для остальных — один правильный
  const correctAnswer = q.options[q.correct];
  const correctIndex = shuffled.indexOf(correctAnswer);

  let html = '';
  if (isHooligan) {
    html += `<div class="hack-tag">🤡 ХУЛИГАНСКИЙ ВОПРОС (все ответы верны)</div>`;
  } else if (isWeird) {
    html += `<div class="hack-tag">🌀 СТРАННЫЙ ВОПРОС</div>`;
  }
  html += q.q;
  html += `<div class="options">`;
  shuffled.forEach((opt, idx) => {
    const isCorrect = isHooligan || (idx === correctIndex);
    html += `<button data-answer="${opt}" data-correct="${isCorrect ? 'true' : 'false'}" class="option-btn">${opt}</button>`;
  });
  html += `</div>`;

  addMessage(html, 'in', 30);
  startTimer(30);
  updateProgress();

  // Обработчики на кнопки
  setTimeout(() => {
    const btns = container.querySelectorAll('.option-btn');
    btns.forEach(btn => {
      btn.addEventListener('click', function(e) {
        if (gameOver || !waitingForAnswer) return;
        const isCorrect = this.dataset.correct === 'true';
        const answerText = this.dataset.answer;
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        stopTimer();
        waitingForAnswer = false;

        if (isCorrect) {
          addMessage(`✅ ${isHooligan ? 'Ха-ха! 😄' : 'Верно!'} ${answerText}`, 'out');
          playBeep(1200, 150);
          questionIndex++;
          if (questionIndex >= TOTAL_QUESTIONS) {
            setTimeout(finishGame, 800);
          } else {
            setTimeout(showQuestion, 900);
          }
        } else {
          addMessage(`❌ Неверно. Попробуй ещё раз.`, 'out');
          playBeep(200, 300, 'square');
          // Даём второй шанс с новым вопросом
          setTimeout(() => {
            if (!gameOver && questionIndex < TOTAL_QUESTIONS) {
              showQuestion();
            }
          }, 1200);
        }
      });
    });
  }, 100);
}

// ---- Финал ----
function finishGame() {
  if (gameOver) return;
  gameOver = true;
  addSystemMessage('📁 Все файлы расшифрованы. Ты узнал правду.');
  addMessage('Брат... он оставил тебе послание: "Ты справился. Теперь твоя очередь хранить тайну."', 'in');
  addMessage('Или... может быть, это только начало?', 'in');
  statusText.textContent = '📴 история завершена';
  input.disabled = true;
  sendBtn.disabled = true;
  progressFill.style.width = '100%';
  playBeep(1000, 200);
}
